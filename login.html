<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Log in | Study Corner</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
<nav class="navbar" aria-label="Main navigation">
<a class="logo" href="index.html">Study Corner</a>
<ul class="nav-links">

<main id="main-content" class="simple-main">
<h1>Log in</h1>
<p>Login is not set up yet. You can use the website without an account.</p>
<p>This form is only a design preview. Do not enter a real password.</p>
<form id="login-form" class="simple-form">
<label for="login-email">Email</label>
<input type="email" id="login-email" name="email" placeholder="example@email.com" required>
<label for="login-password">Password</label>
<input type="password" id="login-password" name="password" placeholder="Demo only" required>
<button class="button button-dark" type="submit">Test form</button>
<p id="login-notice" role="status" aria-live="polite"></p>
</form>
<script>
document.getElementById("login-form").addEventListener("submit", function (event) {
  event.preventDefault();
  document.getElementById("login-password").value = "";
  document.getElementById("login-notice").textContent = "This is only a preview. You are not logged in.";
});
</script>
</main>
<footer class="site-footer simple-footer">
<p>Study Corner | Student project</p>
<p class="legal-links"><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms</a></p>
</footer>
</body>
</html>
